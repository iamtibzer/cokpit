<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B6E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#EDF1F0;--surface:#FFFFFF;--ink:#132220;--muted:#5A6B68;--line:#D2DBD9;--track:#DDE5E3;
  --accent:#0B6E78;--accent-ink:#FFFFFF;--good:#1E9A62;--mid:#C98A0E;--bad:#D2463A;
  --velo:#E07A1F;--natation:#2563D9;--course:#1E9A62;--muscu:#8A4FD8;--autre:#C2417A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1615;--surface:#162120;--ink:#E6EFED;--muted:#91A5A1;--line:#283836;--track:#22302E;
  --accent:#4FC3CE;--accent-ink:#0E1615;--good:#3CC487;--mid:#F0B93E;--bad:#F06A5E;
  --velo:#F59A4A;--natation:#6B9BFF;--course:#3CC487;--muscu:#B48CFF;--autre:#F07AAE;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1615;--surface:#162120;--ink:#E6EFED;--muted:#91A5A1;--line:#283836;--track:#22302E;
  --accent:#4FC3CE;--accent-ink:#0E1615;--good:#3CC487;--mid:#F0B93E;--bad:#F06A5E;
  --velo:#F59A4A;--natation:#6B9BFF;--course:#3CC487;--muscu:#B48CFF;--autre:#F07AAE;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:620px;margin:0 auto;padding:14px 14px 112px}
h1,h2,h3,.cd{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:30px}h2{font-size:21px;margin-bottom:6px}h3{font-size:17px;margin:12px 0 2px}
p{margin:.35em 0}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
:is(button,input,select,textarea,summary):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:500 16px "Barlow",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input,select{height:42px;padding:0 10px}
textarea{width:100%;padding:8px 10px;resize:vertical;min-height:44px}
.ok{color:var(--good)}.warn{color:var(--mid)}.ko{color:var(--bad)}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good)}

.race-strip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 14px;margin-top:12px}
.race-strip b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34px;line-height:1}
.race-strip span{display:block;font-size:14px;opacity:.85}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:600}
.tile .val{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1.1}
.tile .val small{font-size:17px;color:var(--muted)}
.tile .sub{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px}

.btn{display:block;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;margin-top:12px;padding:0 14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;font-size:15px;width:auto;display:inline-block;margin-top:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar>div{flex:1;text-align:center}
.datebar h1{font-size:26px}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1}
.nav:disabled{opacity:.3}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row>.lab{min-width:0}.row>.lab b{display:block;font-weight:600}.row>.lab small{color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.stepper output{min-width:44px;text-align:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700}
.stepper.big button{width:56px;height:56px;font-size:26px}
.stepper.big output{font-size:44px;min-width:70px}
.num{width:112px;text-align:right}
.scale{display:flex;gap:4px}
.scale button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scalebox{padding:9px 0;border-top:1px solid var(--line)}
.scalebox .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.scalebox .head{display:flex;justify-content:space-between;align-items:center;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fchip{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--bg);border:1px solid var(--line)}
.fchip.unk{border-style:dashed;color:var(--mid)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}

.wo{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.wo:first-child{border-top:0}
.wo .t{flex:1;min-width:0}.wo .t b{display:block}.wo .t small{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:36px;flex-shrink:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{width:100%}
input[type=range]{width:100%;height:30px;padding:0;background:none;border:0;accent-color:var(--accent)}

.meal{padding:8px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal label{font-weight:600;display:block;margin-bottom:4px}
.meal .chips{margin-top:6px}
.macro{display:grid;grid-template-columns:72px 1fr 92px;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.macro b{font-weight:600}.macro span:last-child{text-align:right}

.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:22px;height:22px;accent-color:var(--good);flex-shrink:0}
.task .t{flex:1;min-width:0}.task .t b{display:block;font-weight:600}
.task.done b{text-decoration:line-through;color:var(--muted)}
.task small{color:var(--muted)}.task small.late{color:var(--bad);font-weight:600}
.flag{color:var(--bad);font-weight:700}

.race{border-left:5px solid var(--accent)}
.race .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.race .jx{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:38px;line-height:1;text-align:right}
.race .jx small{display:block;font-size:13px;font-family:"Barlow",sans-serif;font-weight:600;color:var(--muted)}
.bm{margin:10px 0}
.bm .l{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.tip{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}

.chartbox{position:relative;height:220px;margin-top:8px}
.kpis{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.kpis div{flex:1;min-width:90px;background:var(--bg);border-radius:10px;padding:8px 10px}
.kpis b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;line-height:1.1}
.kpis small{color:var(--muted);font-size:12px;line-height:1.2;display:block}
.milestone{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}

.bilan h3:first-child{margin-top:0}
.bilan p{font-size:15px}
.aitext{white-space:pre-wrap;font-size:15px;background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-weight:600;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden>
  <button data-a="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Aujourd’hui</button>
  <button data-a="tab" data-tab="saisie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19h14M7 15l9-9 3 3-9 9H7z"/></svg>Saisie</button>
  <button data-a="tab" data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg>Progrès</button>
  <button data-a="tab" data-tab="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg>Courses</button>
  <button data-a="tab" data-tab="taches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Tâches</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   COCKPIT · application de suivi sport & bien-être (fichier unique)

   Architecture
   1. Utilitaires        dates, formatage
   2. Stockage           état en localStorage + synchro facultative (db)
   3. Référentiels       sports, boissons, aliments, courses
   4. Calculs            nutrition, charge, récupération, tabac, courses
   5. Bilans             quotidien / hebdomadaire (règles + Claude en option)
   6. Vues               Aujourd'hui, Saisie, Progrès, Courses, Tâches, Réglages
   7. Événements         délégation sur data-a

   Modèle de données (clé localStorage "cockpit_v1")
   {
     v:1, u:<horodatage meta>,
     profile:{name,sex,age,height,weight,cigBase,cigDrop,packPrice,canBase,canDrop,jointPrice,canStart,stepGoal,start},
     days:{ "AAAA-MM-JJ":{
        u, cigs, joints, steps, weight, sleepH, sleepQ, forme, soreness, stress, hrRest, note,
        read:true|false, readMin, book,
        drank:true|false, drinks:[{type,n}],
        workouts:[{id,sport,name,min,dist(km),elev(m),rpe,note}],
        meals:{breakfast,lunch,dinner,snacks,effort},     // texte libre
        foodAI:{sig,items:[{meal,label,kcal,carbs,protein,fat}]} } },
     tasks:[{id,title,due,prio,done,doneAt,created}],
     races:[{id,name,date,type,goal,result,approx}]
   }
   ===================================================================== */

/* ---------- 1. Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const mondayOf=k=>addDays(k,-((parse(k).getDay()+6)%7));
const fmtD=(k,o={weekday:"long",day:"numeric",month:"long"})=>parse(k).toLocaleDateString("fr-FR",o);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nf=(v,d=0)=>v==null||!isFinite(v)?"—":Number(v).toLocaleString("fr-FR",{maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const norm=s=>String(s).toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const range=(a,b)=>{const r=[];for(let k=a;k<=b;k=addDays(k,1))r.push(k);return r};
const avg=a=>{const x=a.filter(v=>v!=null&&isFinite(v));return x.length?x.reduce((s,v)=>s+v,0)/x.length:null};
const sum=a=>a.reduce((s,v)=>s+(+v||0),0);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 2. Stockage ---------- */
const LS="cockpit_v1";
const DEFAULT_RACES=[
  {id:"r1",name:"10 km de la Tour Eiffel",date:"2026-12-07",type:"10k",goal:"",result:""},
  {id:"r2",name:"Ironman",date:"2026-12-17",type:"ironman",goal:"",result:""},
  {id:"r3",name:"Écotrail 35 km",date:"2027-03-21",type:"trail35",goal:"",result:""},
  {id:"r4",name:"Half Ironman",date:"2027-04-18",type:"half",goal:"",result:"",approx:true}
];
const blank=()=>({v:1,u:0,profile:null,days:{},tasks:[],media:[],races:DEFAULT_RACES.map(r=>({...r}))});
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.v===1)return Object.assign(blank(),o)}}catch(e){}return blank()}
let S=loadLocal();
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("Stockage de l’appareil indisponible")}}
const D=k=>S.days[k]||{};                        // lecture
const W=k=>S.days[k]||(S.days[k]={});            // écriture
function touchDay(k){W(k).u=Date.now();saveLocal();markDirty("m-"+k.slice(0,7))}
function touchMeta(){S.u=Date.now();saveLocal();markDirty("meta")}

/* Synchro facultative : copie privée dans data/users/<id>/ (meta + un document par mois) */
const SY={db:null,col:null,on:false,dirty:new Set(),timer:null,remoteU:{}};
function markDirty(key){if(!SY.on)return;SY.dirty.add(key);clearTimeout(SY.timer);SY.timer=setTimeout(flush,1500)}
async function flush(){
  if(!SY.on)return;
  const keys=[...SY.dirty];SY.dirty.clear();
  for(const key of keys){
    try{
      if(key==="meta")await SY.col.doc("meta").set({u:S.u,profile:S.profile,tasks:S.tasks,races:S.races,media:S.media});
      else{const m=key.slice(2),days={};for(const[k,v]of Object.entries(S.days))if(k.startsWith(m))days[k]=v;
        await SY.col.doc(key).set({u:Date.now(),days})}
    }catch(e){
      if(e&&e.code==="unavailable"){SY.dirty.add(key);clearTimeout(SY.timer);SY.timer=setTimeout(flush,4000)}
      else{SY.on=false;renderSync();if(e&&e.code==="quota_exceeded")toast("Sauvegarde en ligne pleine : les données restent sur l’appareil")}
    }
  }
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    SY.db=db;SY.col=db.collection("data/users/"+id);
    const snap=await SY.col.get();
    let changed=false,remoteMetaU=0;const seenMonths=new Set();
    for(const doc of snap.docs){
      const x=doc.data()||{};
      if(doc.id==="meta"){remoteMetaU=x.u||0;
        if(remoteMetaU>(S.u||0)){S.profile=x.profile??S.profile;S.tasks=x.tasks||[];S.races=x.races||S.races;S.media=x.media||S.media||[];S.u=remoteMetaU;changed=true}}
      else if(doc.id.startsWith("m-")){seenMonths.add(doc.id);
        for(const[k,v]of Object.entries(x.days||{})){SY.remoteU[k]=v.u||0;if(!S.days[k]||(v.u||0)>(S.days[k].u||0)){S.days[k]=v;changed=true}}}
    }
    SY.on=true;
    if((S.u||0)>remoteMetaU&&S.profile)SY.dirty.add("meta");
    for(const[k,v]of Object.entries(S.days))if((v.u||0)>(SY.remoteU[k]||0))SY.dirty.add("m-"+k.slice(0,7));
    if(SY.dirty.size)flush();
    if(changed){saveLocal();render()}else renderSync();
  }catch(e){SY.on=false;renderSync()}
}
function renderSync(){const el=$("#sync");if(el){el.className="sync"+(SY.on?" on":"");el.innerHTML=`<i></i>${SY.on?"Sauvegardé dans ton compte Claude":"Données sur cet appareil"}`}}

/* Claude (facultatif) : estimation des repas et bilans rédigés */
let SAMPLE=null,DL=null;
(async()=>{try{if(window.claude&&window.claude.use){const[s,d]=await Promise.all([window.claude.use("sample"),window.claude.use("downloads")]);SAMPLE=s;DL=d;if(SAMPLE||DL)render()}}catch(e){}})();

/* ---------- 3. Référentiels ---------- */
const SPORTS={
  velo:{l:"Vélo",met:8,c:"--velo",dist:true,elev:true},
  natation:{l:"Natation",met:8,c:"--natation",dist:true,swim:true},
  course:{l:"Course",met:10,c:"--course",dist:true,elev:true},
  muscu:{l:"Muscu",met:5,c:"--muscu"},
  autre:{l:"Nouveau sport",met:6,c:"--autre",dist:true}
};

function parseItem(raw){
  const n=norm(raw).trim();let qty=1,m;
  if((m=n.match(/^(\d+)\s*\/\s*(\d+)/)))qty=m[1]/m[2];
  else if((m=n.match(/^(\d+(?:[.,]\d+)?)/)))qty=parseFloat(m[1].replace(",","."));
  else if((m=n.match(/^(une?|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|douze|demie?|moitie|quart)\b/)))qty=NW[m[1]];
  const food=FOODS.find(f=>f.re.test(n));
  if(!food)return{raw,unknown:true};
  if((m=n.match(/(\d+)\s*(g|gr|grammes?|ml)\b/))&&food.g)qty=+m[1]/food.g;
  return{raw,qty,food,k:food.k*qty,c:food.c*qty,p:food.p*qty,f:food.f*qty};
}

const wos=k=>D(k).workouts||[];
const wload=w=>(+w.min||0)*(+w.rpe||5);
const drinkUnits=d=>sum((d.drinks||[]).map(x=>(DRINKS[x.type]?.u||1)*(x.n||0)));
function weightAt(k){let best=null,bk="";for(const[d,v]of Object.entries(S.days))if(v.weight&&d<=k&&d>bk){bk=d;best=+v.weight}return best||+S.profile?.weight||70}
function exKcal(w,x){return(SPORTS[x.sport]||SPORTS.autre).met*(.55+(+x.rpe||5)*.075)*w*(+x.min||0)/60}
function carbFactor(k){
  const mins=sum(wos(k).map(w=>w.min)),hard=wos(k).some(w=>(+w.rpe||0)>=7);
  const pre=S.races.find(r=>{const d=diff(k,r.date);return d>=1&&d<=2&&r.type!=="10k"});
  if(pre)return{g:10,why:`charge glucidique avant ${pre.name}`};
  if(S.races.some(r=>r.type==="10k"&&diff(k,r.date)===1))return{g:7,why:"veille de course"};
  if(S.races.some(r=>r.date===k))return{g:8,why:"jour de course"};
  if(mins===0)return{g:3.5,why:"jour sans entraînement"};
  if(mins<60)return{g:hard?5.5:5,why:"entraînement de moins d’une heure"};
  if(mins<120)return{g:hard?7:6,why:"1 à 2 h d’entraînement"};
  if(mins<240)return{g:8,why:"grosse journée, 2 à 4 h"};
  return{g:10,why:"très grosse journée, plus de 4 h"};
}
function targets(k){
  const p=S.profile,w=weightAt(k),cf=carbFactor(k);
  const bmr=10*w+6.25*(+p.height)-5*(+p.age)+(p.sex==="h"?5:-161);
  const ex=sum(wos(k).map(x=>exKcal(w,x)));
  return{w,bmr,ex,cf,kcal:Math.round((bmr*1.35+ex)/10)*10,carbs:Math.round(cf.g*w),carbLo:Math.round((cf.g-1)*w),carbHi:Math.round((cf.g+1)*w),prot:Math.round(1.8*w),fat:Math.round(1*w)};
}
function intake(k){
  const d=D(k),meals=d.meals||{},sig=mealSig(meals);
  let items=[],src="local";const unknown=[];
  if(d.foodAI&&d.foodAI.sig===sig){items=d.foodAI.items.map(i=>({k:+i.kcal||0,c:+i.carbs||0,p:+i.protein||0,f:+i.fat||0}));src="claude"}
  else for(const m of MEALS)for(const it of parseMeal(meals[m.k]))it.unknown?unknown.push(it.raw):items.push(it);
  const dr=d.drinks||[];
  const tot={k:sum(dr.map(x=>(DRINKS[x.type]?.k||0)*x.n)),c:sum(dr.map(x=>(DRINKS[x.type]?.c||0)*x.n)),p:0,f:0};
  for(const i of items){tot.k+=i.k;tot.c+=i.c;tot.p+=i.p;tot.f+=i.f}
  return{...tot,src,unknown,any:MEALS.some(m=>(meals[m.k]||"").trim())};
}
const loadSum=(a,b)=>sum(range(a,b).map(k=>sum(wos(k).map(wload))));
function acwr(k){const a=loadSum(addDays(k,-6),k),c=loadSum(addDays(k,-27),k)/4,hist=Object.keys(S.days).some(d=>d<=addDays(k,-21)&&wos(d).length);return{a,c,r:c>0&&hist?a/c:null}}
function acwrText(r){if(r==null)return"historique insuffisant (3 semaines)";if(r<.8)return"charge en baisse";if(r<=1.3)return"charge maîtrisée";if(r<=1.5)return"charge en hausse, surveille la récup";return"pic de charge, risque de blessure accru"}
function recovery(k){
  const d=D(k),parts=[];
  if(d.sleepH!=null)parts.push([clamp(d.sleepH/8,0,1),.3]);
  if(d.sleepQ)parts.push([(d.sleepQ-1)/4,.2]);
  if(d.forme)parts.push([(d.forme-1)/4,.2]);
  if(d.soreness)parts.push([(5-d.soreness)/4,.15]);
  if(d.stress)parts.push([(5-d.stress)/4,.15]);
  if(!parts.length)return null;
  let s=sum(parts.map(p=>p[0]*p[1]))/sum(parts.map(p=>p[1]))*100;
  const yu=drinkUnits(D(addDays(k,-1)));if(yu>=3)s-=8;else if(yu>=1)s-=3;
  const r=acwr(k).r;if(r!=null&&r>1.5)s-=10;else if(r!=null&&r>1.3)s-=5;
  return Math.round(clamp(s,0,100));
}

function cigStats(k){
  const p=S.profile,base=+p.cigBase||0;let avoided=0,streak=0,free=0;
  for(const d of range(p.start,k)){const c=D(d).cigs;if(c!=null)avoided+=base-c}
  let kk=D(k).cigs==null?addDays(k,-1):k;
  while(kk>=p.start){const c=D(kk).cigs;if(c==null||c>cigTarget(kk))break;streak++;kk=addDays(kk,-1)}
  kk=D(k).cigs==null?addDays(k,-1):k;
  while(kk>=p.start){if(D(kk).cigs!==0)break;free++;kk=addDays(kk,-1)}
  const a7=avg(range(addDays(k,-6),k).map(d=>D(d).cigs)),p7=avg(range(addDays(k,-13),addDays(k,-7)).map(d=>D(d).cigs));
  avoided=Math.max(0,avoided);
  return{avoided,euros:avoided*(+p.packPrice||12.5)/20,streak,free,a7,p7,base,red:a7!=null&&base?1-a7/base:null};
}

function canStats(k){

  kk=D(k).joints==null?addDays(k,-1):k;
  while(kk>=st){if(D(kk).joints!==0)break;free++;kk=addDays(kk,-1)}

    ${line("Protéines",it.p,t.prot,null,null,"g")}

/* ---------- 7. Événements ---------- */
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2400)}
const val=id=>{const e=$("#"+id);return e?e.value.trim():""};
const keepScroll=fn=>{const y=window.scrollY;fn();window.scrollTo(0,y)};

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,dd=W.bind(null,cur);
  switch(a){
    case"tab":tab=b.dataset.tab;editRace=null;resetArmed=false;if(tab==="saisie")cur=today();render();window.scrollTo(0,0);break;
    case"dnav":{const n=addDays(cur,+b.dataset.d);if(n<=today()){cur=n;render();window.scrollTo(0,0)}break}
    case"step":{const f=b.dataset.f,s=+b.dataset.s,d=dd();let v=d[f];
      if(v==null)v=f==="sleepH"?7:Math.max(0,s);else v=Math.max(0,Math.round((v+s)*10)/10);if(f==="sleepH")v=Math.min(14,v);
      d[f]=v;touchDay(cur);keepScroll(render);break}
    case"scale":{const f=b.dataset.f,v=+b.dataset.v,d=dd();d[f]=d[f]===v?null:v;touchDay(cur);keepScroll(render);break}
    case"wf-sport":wf.sport=b.dataset.v;keepScroll(render);break;
    case"wo-add":{const min=+val("wf-min");if(!min){toast("Indique la durée en minutes");$("#wf-min").focus();break}
      const s=SPORTS[wf.sport];let dist=+val("wf-dist")||0;if(s.swim)dist=dist/1000;
      if(wf.sport==="autre"&&!val("wf-name")){toast("Indique le nom du sport");$("#wf-name").focus();break}
      const d=dd();(d.workouts=d.workouts||[]).push({id:uid(),sport:wf.sport,name:wf.sport==="autre"?val("wf-name"):"",min,dist,elev:+val("wf-elev")||0,rpe:+val("wf-rpe")||5,note:val("wf-note")});
      wf.name="";touchDay(cur);toast("Séance ajoutée");keepScroll(render);break}
    case"wo-del":{const d=dd();d.workouts.splice(+b.dataset.i,1);touchDay(cur);keepScroll(render);break}
    case"drank":{const d=dd(),v=b.dataset.v==="1";d.drank=v;if(v&&!(d.drinks||[]).length)d.drinks=[{type:"vin",n:1}];if(!v)d.drinks=[];touchDay(cur);keepScroll(render);break}
    case"read":{const d=dd(),v=b.dataset.v==="1";d.read=d.read===v?null:v;if(d.read&&!d.book)d.book=lastBook(cur)||"";touchDay(cur);keepScroll(render);break}
    case"lmode":listMode=b.dataset.v;render();break;
    case"mnav":mediaMonth=shiftMonth(mediaMonth,+b.dataset.d);render();break;
    case"mkind":mediaKind=b.dataset.v;{const t=val("mf-title");render();$("#mf-title").value=t}break;
    case"media-add":{const title=val("mf-title");if(!title){toast("Écris un titre");$("#mf-title").focus();break}
      S.media.push({id:uid(),title,kind:mediaKind,month:mediaMonth,done:false});touchMeta();render();toast("Ajouté à la liste");break}
    case"media-move":{const x=S.media.find(y=>y.id===b.dataset.id);x.month=mediaMonth;touchMeta();keepScroll(render);break}
    case"media-del":S.media=S.media.filter(y=>y.id!==b.dataset.id);touchMeta();keepScroll(render);break;
    case"dr-add":{const d=dd();d.drinks.push({type:"demi",n:1});touchDay(cur);keepScroll(render);break}
    case"dr-n":{const d=dd(),i=+b.dataset.i;d.drinks[i].n=Math.max(0,d.drinks[i].n+ +b.dataset.s);if(d.drinks[i].n===0)d.drinks.splice(i,1);if(!d.drinks.length)d.drank=false;touchDay(cur);keepScroll(render);break}
    case"food-ai":await foodAI(b);break;
    case"bmode":bilanMode=b.dataset.v;keepScroll(render);break;
    case"bilan-ai":await bilanAI(b);break;
    case"period":period=+b.dataset.v;keepScroll(render);break;
    case"task-quick":taskDraft.due=b.dataset.v;taskDraft.prio=val("tf-prio")||"normale";{const t=val("tf-title");render();$("#tf-title").value=t}break;
    case"task-add":{const title=val("tf-title"),due=val("tf-due");if(!title){toast("Écris l’intitulé de la tâche");$("#tf-title").focus();break}if(!due){toast("Choisis une échéance");break}
      S.tasks.push({id:uid(),title,due,prio:val("tf-prio"),done:false,created:today()});taskDraft={due,prio:"normale"};touchMeta();render();toast("Tâche ajoutée");break}
    case"task-del":S.tasks=S.tasks.filter(t=>t.id!==b.dataset.id);touchMeta();keepScroll(render);break;
    case"race-edit":editRace=b.dataset.id;render();break;
    case"race-cancel":editRace=null;render();break;
    case"race-del":S.races=S.races.filter(r=>r.id!==b.dataset.id);editRace=null;touchMeta();render();break;
    case"race-save":{const name=val("rf-name"),date=val("rf-date");if(!name||!date){toast("Nom et date sont nécessaires");break}
      const r={name,date,type:val("rf-type"),goal:val("rf-goal"),result:val("rf-result"),approx:$("#rf-approx").checked};
      if(b.dataset.id==="new")S.races.push({id:uid(),...r});else Object.assign(S.races.find(x=>x.id===b.dataset.id),r);
      editRace=null;touchMeta();render();break}
    case"profile-save":{const n=id=>+val(id);
      const p={name:val("pf-name"),sex:val("pf-sex"),age:n("pf-age"),height:n("pf-height"),weight:n("pf-weight"),stepGoal:n("pf-steps")||10000,cigBase:n("pf-cig")||0,cigDrop:clamp(n("pf-drop")||10,0,50),packPrice:n("pf-price")||12.5,canBase:n("pf-can")||0,canDrop:clamp(n("pf-candrop")||15,0,50),jointPrice:n("pf-jprice")||5,canStart:S.profile?.canStart||(n("pf-can")>0?today():null),start:S.profile?.start||today()};
      if(!(p.age>=14&&p.age<=90)){toast("Indique ton âge");$("#pf-age").focus();break}
      if(!(p.height>=130&&p.height<=220)){toast("Indique ta taille en cm");$("#pf-height").focus();break}
      if(!(p.weight>=35&&p.weight<=200)){toast("Indique ton poids en kg");$("#pf-weight").focus();break}
      const first=!S.profile;S.profile=p;if(first&&D(today()).weight==null){W(today()).weight=p.weight;touchDay(today())}
      touchMeta();toast(first?"C’est parti":"Profil enregistré");tab="home";render();window.scrollTo(0,0);break}
    case"export":{const name=`cockpit-${today()}.json`,txt=JSON.stringify(S,null,1);try{if(DL){await DL.save({filename:name,data:txt});break}const file=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Sauvegarde Cockpit"});break}const u=URL.createObjectURL(file),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){if(err&&err.name!=="AbortError"&&err.code!=="declined")toast("Export impossible, utilise « Copier les données »")}break}
    case"copy":{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast("Données copiées")}catch(err){const t=$("#imp");t.value=txt;t.select();toast("Sélectionne et copie le texte affiché")}break}
    case"import":{try{const o=JSON.parse(val("imp"));if(!o||o.v!==1||typeof o.days!=="object")throw 0;S=Object.assign(blank(),o);S.u=Date.now();
      Object.values(S.days).forEach(d=>d.u=Date.now());saveLocal();if(SY.on){SY.dirty.add("meta");Object.keys(S.days).forEach(k=>SY.dirty.add("m-"+k.slice(0,7)));flush()}
      toast("Données restaurées");tab="home";render()}catch(err){toast("Ce texte n’est pas une sauvegarde Cockpit valide")}break}
    case"reset":if(!resetArmed){resetArmed=true;b.textContent="Confirmer : tout effacer";break}
      {const keepRaces=blank();S=keepRaces;S.u=Date.now();saveLocal();resetArmed=false;
       if(SY.on){try{const snap=await SY.col.get();for(const d of snap.docs)await SY.col.doc(d.id).delete()}catch(err){}}
       tab="home";render();toast("Données effacées")}break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.a==="task-toggle"){const x=S.tasks.find(y=>y.id===t.dataset.id);x.done=t.checked;x.doneAt=t.checked?today():null;touchMeta();keepScroll(render);return}
  if(t.dataset.a==="media-toggle"){const x=S.media.find(y=>y.id===t.dataset.id);x.done=t.checked;x.doneAt=t.checked?today():null;touchMeta();keepScroll(render);return}
  if(t.dataset.a==="dr-type"){W(cur).drinks[+t.dataset.i].type=t.value;touchDay(cur);keepScroll(render);return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="wf-rpe"){wf.rpe=+t.value;$("#wf-rpe-o").textContent=t.value;return}
  if(t.id==="wf-name"){wf.name=t.value;return}
  if(t.dataset.meal){const d=W(cur);d.meals=d.meals||{};d.meals[t.dataset.meal]=t.value;touchDay(cur);
    $("#chips-"+t.dataset.meal).innerHTML=mealChips(t.value);$("#nutri").innerHTML=nutriHTML(cur);
    t.style.height="auto";t.style.height=t.scrollHeight+2+"px";return}
  if(t.dataset.f){const d=W(cur);const raw=t.value.replace(",",".");d[t.dataset.f]=t.tagName==="TEXTAREA"||t.type==="text"?t.value:(raw===""?null:Math.max(0,+raw));touchDay(cur)}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;
  if(e.target.id==="tf-title"){e.preventDefault();$('[data-a="task-add"]').click()}
  if(e.target.id==="mf-title"){e.preventDefault();$('[data-a="media-add"]').click()}});

async function foodAI(btn){
  const meals=D(cur).meals||{},sig=mealSig(meals);
  btn.disabled=true;btn.textContent="Estimation en cours…";
  try{
    const input=`Tu es nutritionniste du sport. Estime les apports de ces repas décrits en portions naturelles (contexte France, portions standard pour un adulte sportif). Si une quantité est floue, prends une portion moyenne. Réponds uniquement avec ce JSON, sans texte autour : {"items":[{"meal":"breakfast|lunch|dinner|snacks|effort","label":"aliment et quantité","kcal":0,"carbs":0,"protein":0,"fat":0}]}
Repas : ${JSON.stringify(Object.fromEntries(MEALS.filter(m=>(meals[m.k]||"").trim()).map(m=>[m.k,meals[m.k]])))}`;
    const r=await SAMPLE.json(input,{modelTier:"quick"});
    if(!r||!Array.isArray(r.items))throw{code:"invalid_json"};
    W(cur).foodAI={sig,items:r.items.map(i=>({meal:String(i.meal||""),label:String(i.label||""),kcal:+i.kcal||0,carbs:+i.carbs||0,protein:+i.protein||0,fat:+i.fat||0}))};
    touchDay(cur);$("#nutri").innerHTML=nutriHTML(cur);toast("Estimation mise à jour");
  }catch(err){
    if(err&&err.code==="not_granted"){SAMPLE=null;$("#nutri").innerHTML=nutriHTML(cur)}
    else{toast(err&&err.code==="rate_limited"?"Trop de demandes, réessaie dans une minute":"Estimation impossible pour le moment");btn.disabled=false;btn.textContent="Estimer plus finement avec Claude"}
  }
}
async function bilanAI(btn){
  const k=today(),mode=bilanMode,data={type:mode==="day"?"bilan du jour":"bilan de la semaine",date:k,sections:mode==="day"?dailyBilan(k):weeklyBilan(k),
    courses:racesSorted().filter(r=>r.date>=k).map(r=>({nom:r.name,date:r.date,jours:diff(k,r.date),phase:phase(r,k)}))};
  btn.disabled=true;const box=$("#aibox");box.innerHTML=`<div class="aitext">…</div>`;const out=box.firstChild;
  try{
    const r=await SAMPLE(`Tu es mon coach (triathlon, trail) et nutritionniste du sport. Voici mon ${data.type} calculé par mon application, en JSON. Écris un bilan en français, en me tutoyant, de 120 à 180 mots, en trois courts paragraphes sans titres ni listes : 1) ressenti et récupération, 2) nutrition, surtout l’adéquation des glucides à la charge d’entraînement, 3) deux ou trois priorités concrètes pour ${mode==="day"?"demain":"la semaine prochaine"}, en tenant compte des courses à venir. Valorise les progrès sur le tabac sans moraliser. Pas de diagnostic médical. Base-toi uniquement sur ces données.
Données : ${JSON.stringify(data)}`,{onText:({text})=>{out.textContent=text}});
    aiText[mode]=r.text;out.textContent=r.text;
  }catch(err){
    if(err&&err.code==="not_granted"){SAMPLE=null;box.innerHTML="";keepScroll(render)}
    else{out.textContent=err&&err.code==="rate_limited"?"Trop de demandes, réessaie dans une minute.":"Bilan indisponible pour le moment."}
  }
  btn.disabled=false;
}
